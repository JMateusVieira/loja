<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Camisa')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-7">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h3 class="card-title mb-4"
                        th:text="${camisa.id} == null ? 'Nova Camisa' : 'Editar Camisa'"></h3>

                    <form th:action="@{/camisas/salvar}" th:object="${camisa}" method="post">
                        <input type="hidden" th:field="*{id}"/>

                        <div class="mb-3">
                            <label for="modelo" class="form-label">Modelo</label>
                            <input type="text" id="modelo" class="form-control"
                                   th:field="*{modelo}"
                                   th:classappend="${#fields.hasErrors('modelo')} ? 'is-invalid'"
                                   placeholder="Ex: Camisa Polo Branca"/>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('modelo')}"
                                 th:errors="*{modelo}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="preco" class="form-label">Preço (R$)</label>
                            <input type="number" step="0.01" id="preco" class="form-control"
                                   th:field="*{preco}"
                                   th:classappend="${#fields.hasErrors('preco')} ? 'is-invalid'"
                                   placeholder="0.00"/>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('preco')}"
                                 th:errors="*{preco}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="marca" class="form-label">Marca</label>
                            <select id="marca" class="form-select"
                                    th:field="*{marca.id}"
                                    th:classappend="${#fields.hasErrors('marca')} ? 'is-invalid'">
                                <option value="">-- Selecione uma marca --</option>
                                <option th:each="m : ${marcas}"
                                        th:value="${m.id}"
                                        th:text="${m.nome}"></option>
                            </select>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('marca')}"
                                 th:errors="*{marca}"></div>
                        </div>

                        <button type="submit" class="btn btn-success">
                            <i class="bi bi-check-lg"></i> Salvar
                        </button>
                        <a th:href="@{/camisas}" class="btn btn-secondary">Cancelar</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
