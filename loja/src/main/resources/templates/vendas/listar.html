<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Vendas')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Vendas</h2>
        <a th:href="@{/vendas/novo}" class="btn btn-danger">Nova Venda</a>
    </div>

    <div class="table-responsive shadow-sm rounded">
        <table class="table table-striped table-hover align-middle mb-0">
            <thead class="table-dark">
                <tr>
                    <th style="width: 70px;">ID</th>
                    <th>Data</th>
                    <th>N.Cliente</th>
                    <th>Q.Itens</th>
                    <th>T.Preço</th>
                    <th style="width: 200px;">Opções</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="venda : ${vendas}">
                    <td th:text="${venda.id}"></td>
                    <td th:text="${venda.dataVenda}"></td>
                    <td th:text="${venda.cliente.nome}"></td>
                    <td>
                        <span class="badge bg-info text-dark"
                              th:text="${venda.camisas.size()} + ' camisa(s)'"></span>
                    </td>
                    <td class="fw-bold text-success"
                        th:text="'R$ ' + ${#numbers.formatDecimal(venda.total, 1, 2)}"></td>
                    <td>
                        <a th:href="@{/vendas/editar/{id}(id=${venda.id})}" class="btn btn-sm btn-outline-primary">
                            <i class="bi bi-pencil"></i> Editar
                        </a>
                        <a th:href="@{/vendas/excluir/{id}(id=${venda.id})}"
                           class="btn btn-sm btn-outline-danger"
                           onclick="return confirm('Excluir esta venda?')">
                            <i class="bi bi-trash"></i> Excluir
                        </a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(vendas)}">
                    <td colspan="6" class="text-center text-muted py-4">Nenhuma venda cadastrada</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
