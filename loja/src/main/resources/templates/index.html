<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Loja de Camisas')}"></head>
<body class="bg-light">
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="bg-dark text-white text-center py-5 mb-5 shadow">
    <div class="container">
        <h1 class="display-4 fw-bold">Loja de Camisas</h1>
    </div>
</div>

<div class="container mb-5">
    <h2 class="mb-4 border-bottom pb-2">Catálogo de Roupas</h2>

    <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4">
        
        <div class="col" th:each="camisa : ${camisas}">
            <div class="card h-100 shadow-sm border-0 d-flex flex-column">
                
                <div class="card-body text-center flex-grow-1">
                    <i class="bi bi-tag text-success" style="font-size: 3.5rem;"></i>
                    
                    <h5 class="card-title mt-3 fw-bold" th:text="${camisa.modelo}">Modelo</h5>
                    
                    <h6 class="mb-3">
                        <span class="badge bg-secondary" th:text="${camisa.marca.nome}">Marca</span>
                    </h6>
                    
                    <p class="card-text fs-4 fw-bold text-success mb-0" 
                       th:text="'R$ ' + ${#numbers.formatDecimal(camisa.preco, 1, 2)}"> R$ 0,00
                    </p>
                </div>
                
                <div class="card-footer bg-white border-top-0 pb-3 text-center mt-auto">
                    <a th:href="@{/vendas/novo(camisaId=${camisa.id})}" class="btn btn-outline-success w-100 fw-bold">
                        <i class="bi bi-cart-plus"></i> Comprar
                    </a>
                </div>
            </div>
        </div>
    </div>

    <div th:if="${#lists.isEmpty(camisas)}" class="text-center py-5 my-5 bg-white rounded shadow-sm">
        <h3 class="mt-3 text-muted">Nenhuma roupa cadastrada</h3>
    </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
