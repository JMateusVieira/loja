<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Marcas')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2><i class="bi bi-tags"></i> Marcas</h2>
        <a th:href="@{/marcas/novo}" class="btn btn-primary">
            <i class="bi bi-plus-lg"></i> Nova Marca
        </a>
    </div>

    <div class="table-responsive shadow-sm rounded">
        <table class="table table-striped table-hover align-middle mb-0">
            <thead class="table-dark">
                <tr>
                    <th style="width: 80px;">ID</th>
                    <th>Nome</th>
                    <th style="width: 200px;">Ações</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="marca : ${marcas}">
                    <td th:text="${marca.id}"></td>
                    <td th:text="${marca.nome}"></td>
                    <td>
                        <a th:href="@{/marcas/editar/{id}(id=${marca.id})}" class="btn btn-sm btn-outline-primary">
                            <i class="bi bi-pencil"></i> Editar
                        </a>
                        <a th:href="@{/marcas/excluir/{id}(id=${marca.id})}"
                           class="btn btn-sm btn-outline-danger"
                           onclick="return confirm('Excluir esta marca?')">
                            <i class="bi bi-trash"></i> Excluir
                        </a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(marcas)}">
                    <td colspan="3" class="text-center text-muted py-4">Nenhuma marca cadastrada.</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
